name: Daily paper scrape

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (after arXiv's overnight announcements)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write            # to commit the updated data/papers.json

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python -m pipeline.run

      - name: Commit results
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily paper update ($(date -u +%Y-%m-%d))"
            git push
          fi
